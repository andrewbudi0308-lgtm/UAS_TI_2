<!DOCTYPE html>
<html>
<head>
    <title>Detail Website</title>
    <style>
        @view-transition {
            navigation: auto;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f8fbff;
            color: #1f2937;
        }

        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 220ms;
        }

        ::view-transition-old(root) {
            animation-name: page-fade-out;
        }

        ::view-transition-new(root) {
            animation-name: page-fade-in;
        }

        @keyframes page-fade-out {
            to {
                opacity: 0;
                transform: translateY(-6px);
            }
        }

        @keyframes page-fade-in {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
        }

        header {
            background-color: #eaf2ff;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            display: inline-block;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #333;
            transition: color 180ms ease;
        }

        nav a:hover {
            color: #2563eb;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
        }

        h1 {
            color: #2563eb;
            margin-top: 0;
        }

        .meta {
            color: #4b5563;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 10px;
            margin-top: 10px;
            transition: transform 160ms ease, background-color 160ms ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button:active {
            transform: scale(0.96);
        }

        .button.secondary {
            background-color: #edf4ff;
            color: #1d4ed8;
            margin-left: 10px;
        }

        ol {
            padding-left: 20px;
            line-height: 1.8;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <span class="logo" aria-label="Logo Belajaryuk"></span>
            <h2>Belajaryuk</h2>
        </div>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="#">Tentang</a>
        </nav>
    </header>

    <main class="container">
        <h1 id="site-title">Judul Website</h1>
        <p class="meta" id="site-description">Deskripsi website.</p>

        <h2>Cara Penggunaan</h2>
        <ol id="site-steps"></ol>

        <a id="site-link" href="#" class="button" target="_blank" rel="noreferrer">Kunjungi Website</a>
        <a href="index.html" class="button secondary">Kembali</a>
    </main>

    <script>

        const params = new URLSearchParams(window.location.search);
        const siteId = params.get('id') || '1';
        const site = sites.find(item => item.id === siteId) || sites[0];

        document.getElementById('site-title').textContent = site.title;
        document.getElementById('site-description').textContent = site.description;

        const stepsList = document.getElementById('site-steps');
        site.steps.forEach(step => {
            const item = document.createElement('li');
            item.textContent = step;
            stepsList.appendChild(item);
        });

        const siteLink = document.getElementById('site-link');
        siteLink.href = site.url;
    </script>
</body>
</html>
